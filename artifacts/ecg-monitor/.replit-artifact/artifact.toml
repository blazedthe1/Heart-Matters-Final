kind = "web"
previewPath = "/ecg-demo/"
title = "ECG Monitor"
version = "1.0.0"
id = "artifacts/ecg-monitor"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/ecg-demo/" ]
localPort = 19635

[services.development]
run = "pnpm --filter @workspace/ecg-monitor run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ecg-monitor", "run", "build" ]
publicDir = "artifacts/ecg-monitor/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19635"
BASE_PATH = "/ecg-demo/"
